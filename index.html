<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mistail</title>
<style>
  :root{--bg:#0f0b24;--fg:#f3f0ff;--muted:#b9b2d9;--accent:#ffd34d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% 30%,#2a1d63,var(--bg) 70%);color:var(--fg);padding:32px 16px;text-align:center}
  h1{font-size:clamp(2.4rem,8vw,4rem);margin:0 0 .2em;letter-spacing:.04em}
  p{color:var(--muted);max-width:520px;line-height:1.5;margin:.4em auto}
  .game{margin-top:28px;padding:18px 22px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff0d}
  .game b{color:var(--accent)}
  footer{margin-top:40px;font-size:.9rem;color:var(--muted)}
  a{color:var(--fg)}
</style>
</head>
<body>
  <h1>Mistail</h1>
  <p>Giochi per smartphone · Mobile games</p>
  <div class="game">
    <p><b>Lux Tower</b> — in arrivo su Android · coming soon</p>
  </div>
  <footer>
    <a href="/privacy/">Privacy policy</a> · <a href="mailto:privacy@mistail.com">privacy@mistail.com</a>
  </footer>
</body>
</html>
